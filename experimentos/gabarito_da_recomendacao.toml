# Gabarito da qualidade da recomendação dos agentes (decisão de 2026-10-25).
#
# Rascunho para a equipe revisar. Depois de revisado, ele fica fixo antes da primeira rodada do
# experimento ponta a ponta, para não ser ajustado depois de ver os resultados.
#
# Para cada categoria do incidente, as ações do catálogo aceitáveis e os papéis de alvo aceitos em
# cada uma. "origem" é um dos atacantes do dataset, identificados pelo MAC; "destino" é o
# dispositivo atacado. Uma recomendação está certa quando a ação proposta aparece na categoria do
# incidente e o alvo, depois de trocado o rótulo pelo endereço, tem um dos papéis listados.
#
# As ações aceitáveis saem do levantamento da equipe em `codigo/agente/recomendacoes/`: só entra
# aqui a ação que a coluna "Ação do catálogo" liga a alguma medida da categoria
# (`codigo/agente/test_gabarito.py` confere). A ação nova, fora do catálogo, não entra na conta
# automática: é contada à parte e avaliada na amostra de 9 casos com a rubrica.
#
# Os três cenários do experimento são DDoS, Recon e BruteForce. As demais categorias ficam aqui
# para o gabarito cobrir todas as que o classificador entrega.

[DDoS]
# Limitar a taxa vale tanto para cada origem quanto para proteger o dispositivo atacado.
limitar_taxa = ["origem", "destino"]
bloquear_ip = ["origem"]

[DoS]
limitar_taxa = ["origem", "destino"]
bloquear_ip = ["origem"]

[Mirai]
limitar_taxa = ["origem", "destino"]
# Os atacantes fazem o papel dos dispositivos já comprometidos pela botnet.
isolar_dispositivo = ["origem"]
revogar_credencial = ["origem"]
# O Telnet e as outras portas de administração por onde a botnet entra ficam nos dispositivos
# comprometidos.
fechar_porta = ["origem"]

[Recon]
bloquear_ip = ["origem"]
limitar_taxa = ["origem"]
# Fechar a porta sem necessidade é no dispositivo varrido.
fechar_porta = ["destino"]

[Spoofing]
isolar_dispositivo = ["origem"]

[Web]
# A única medida do levantamento ligada ao catálogo é conter o dispositivo com backdoor, que é o
# atacado. Nas outras variantes de Web, a resposta esperada é ação nova ou nenhuma ação.
isolar_dispositivo = ["destino"]

[BruteForce]
limitar_taxa = ["origem"]
bloquear_ip = ["origem"]
# A credencial revogada é a da conta atacada, no dispositivo atacado.
revogar_credencial = ["destino"]
