# CI do SentryIoT: roda em todo PR e em todo push na main.
# Quatro conferencias independentes: lint, testes, auditoria das dependencias Python e o frontend
# (testes, auditoria e build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permissao minima: os jobs so leem o repositorio.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execucao anterior. Na main nada e cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Os jobs usam ubuntu-24.04, e nao ubuntu-latest, pelo mesmo motivo das versoes
# fixadas abaixo: o rotulo "latest" troca de sistema sem aviso no repositorio.
env:
  PYTHON_VERSION: "3.11"
  # Versoes fixadas: o resultado do CI nao muda sozinho de um dia para o outro.
  RUFF_VERSION: "0.16.10"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar o ruff
        run: python -m pip install "ruff==${RUFF_VERSION}"

      # Regras padrao do ruff; o ruff.toml so fixa o Python 3.11 e diz o que fica de fora.
      - name: Conferir o codigo
        run: ruff check --output-format=github .

  testes:
    name: Testes (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # O pytest esta fixado no requirements.txt, junto com as demais dependencias.
      - name: Instalar as dependencias do projeto
        run: python -m pip install -r requirements.txt

      # O dataset (CICIoT2023/) nunca esta no CI: os testes que dependem dele
      # sao pulados, e o resumo (-ra) mostra quais foram.
      # Qualquer codigo diferente de zero derruba o job, inclusive "nenhum teste coletado":
      # com testes no repositorio, coletar zero testes e um defeito de configuracao.
      - name: Rodar os testes
        run: python -m pytest -ra

  auditoria:
    name: Auditoria de dependencias (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Job separado dos testes: o pip-audit fica num ambiente so dele e nao
      # mistura as proprias dependencias com as do projeto.
      - name: Procurar vulnerabilidades conhecidas no requirements.txt
        run: |
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
          pip-audit --progress-spinner off -r requirements.txt

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala exatamente o que esta no package-lock.json e falha se ele divergir do package.json.
      - name: Instalar as dependencias
        run: npm ci

      # Vulnerabilidade alta ou critica no que vai para o navegador derruba o job.
      - name: Auditar as dependencias de producao
        run: npm audit --omit=dev --audit-level=high

      # As de desenvolvimento (vite, vitest) so rodam na maquina de quem desenvolve: viram aviso.
      - name: Auditar as dependencias de desenvolvimento (so aviso)
        run: npm audit || echo "::warning title=npm audit::Ha avisos nas dependencias de desenvolvimento do frontend; veja o log deste passo."

      # Leitura do log, reconstrucao do estado, telas e conferencia das listas contra o contrato do MCP.
      - name: Rodar os testes
        run: npm test

      # Confere os tipos (tsc -b) e gera a versao de producao.
      - name: Construir
        run: npm run build
