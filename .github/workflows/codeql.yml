# Analise de seguranca com o CodeQL: o codigo Python, o frontend (TypeScript e os
# scripts em JavaScript) e os proprios workflows do GitHub Actions.
# Dispara quando algum desses arquivos muda e uma vez por semana, para pegar regras
# novas do CodeQL mesmo sem mudanca no codigo.
name: CodeQL

on:
  pull_request:
    paths: ["**.py", "**.ts", "**.tsx", "**.js", "**.mjs", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["**.py", "**.ts", "**.tsx", "**.js", "**.mjs", ".github/workflows/**"]
  schedule:
    - cron: "17 6 * * 1" # segundas, 06:17 UTC

# Permissao minima no topo; so o job abaixo recebe a permissao de escrita.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execucao anterior. Na main nada e cancelado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analisar:
    name: Analise de codigo (${{ matrix.linguagem }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        linguagem: [python, javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write # envia os resultados para a aba Security
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none

      - name: Analisar
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.linguagem }}
